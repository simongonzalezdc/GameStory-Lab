# Primary CI (Forgejo is the primary forge). Every step fails the pipeline on error.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: docker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint workspaces
        run: npm run lint --workspaces
      - name: Test workspaces
        run: npm run test --workspaces
      - name: Build shared
        run: npm run build -w packages/shared
      - name: Build backend
        run: npm run build -w packages/backend
      - name: Verify backend runtime assets in dist
        run: |
          # tsc emits no non-TS files; the build copies runtime-read assets
          # (genre templates, architect markdown) into dist/. Assert shipped.
          missing=0
          for f in packages/backend/src/services/templates/genres/*.json; do
            target="packages/backend/dist/services/templates/genres/$(basename "$f")"
            [ -f "$target" ] || { echo "missing from dist: $target"; missing=1; }
          done
          for f in packages/backend/src/services/architect/templates/*.md; do
            target="packages/backend/dist/services/architect/templates/$(basename "$f")"
            [ -f "$target" ] || { echo "missing from dist: $target"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all runtime assets present in dist"
      - name: Build frontend (tsc + vite)
        run: npm run build -w packages/frontend
  modules:
    runs-on: docker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint and test JS modules
        run: |
          set -euo pipefail
          for m in modules/generative-assets-lab/frontend modules/generative-score-lab modules/shiplab; do
            echo "=== $m ==="
            (cd "$m" && npm ci && npm run lint && npx vitest run)
          done
  python:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps and run pytest
        run: |
          set -euo pipefail
          cd modules/generative-assets-lab/backend
          # node:22 image ships python3 without pip and enforces PEP 668;
          # use a venv (throwaway CI container, no system pollution)
          apt-get update -qq && apt-get install -y -qq python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pytest
