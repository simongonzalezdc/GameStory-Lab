# Primary CI (Forgejo is the primary forge). Every step fails the pipeline on error.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: docker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint workspaces
        run: npm run lint --workspaces
      - name: Test workspaces
        run: npm run test --workspaces
      - name: Build shared
        run: npm run build -w packages/shared
      - name: Build backend
        run: npm run build -w packages/backend
      - name: Build frontend (tsc + vite)
        run: npm run build -w packages/frontend
  modules:
    runs-on: docker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint and test JS modules
        run: |
          set -euo pipefail
          for m in modules/generative-assets-lab/frontend modules/generative-score-lab modules/shiplab; do
            echo "=== $m ==="
            (cd "$m" && npm ci && npm run lint && npx vitest run)
          done
  python:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps and run pytest
        run: |
          set -euo pipefail
          cd modules/generative-assets-lab/backend
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 -m pytest
