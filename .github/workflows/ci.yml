# GameStory-Lab CI — honest gates over npm workspaces. Replaces the former
# `|| true` scaffold (M-20261008-17); the root lint and frontend build lanes
# broken at that HEAD were repaired and widened here (M-20261008-18,
# 2026-10-09). Gated now: root lint (eslint per workspace), npm test (vitest
# per workspace: shared, backend, frontend), shared + backend + frontend
# builds (tsc [+ vite]).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: docker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
      - name: Lint (all workspaces)
        run: npm run lint
      - name: Tests (all workspaces)
        run: npm test
      - name: Build shared
        run: npm run build -w packages/shared
      - name: Build backend
        run: npm run build -w packages/backend
      - name: Build frontend (tsc + vite)
        run: npm run build -w packages/frontend
      # tsc emits no non-TS files. A build can therefore go green while the
      # runtime-read assets (genre templates, architect markdown) are absent
      # from dist/, which boots with zero templates and fails document
      # generation. Assert the assets actually shipped.
      - name: Verify backend runtime assets in dist
        run: |
          missing=0
          for f in src/services/templates/genres/*.json; do
            target="packages/backend/dist/services/templates/genres/$(basename "$f")"
            [ -f "$target" ] || { echo "missing from dist: $target"; missing=1; }
          done
          for f in src/services/architect/templates/*.md; do
            target="packages/backend/dist/services/architect/templates/$(basename "$f")"
            [ -f "$target" ] || { echo "missing from dist: $target"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all runtime assets present in dist"
